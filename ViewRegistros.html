<section id="registros" class="view">
        <div class="section-head"><div><h2>Registrar datos</h2><p>Los registros se guardan directamente en Google Sheets.</p></div></div>
        <div class="card panel" style="margin-bottom:18px">
          <h3>Nueva persona</h3>
          <form id="formPersona" class="form-grid">
            <div class="field"><label>Tipo de documento *</label><select id="tipoDocumentoPersona" name="TIPO_DOCUMENTO" onchange="actualizarDocumentoPersona()" required><option>RUT</option><option>Pasaporte</option></select></div>
            <div class="field"><label>Número de documento *</label><input id="numeroDocumentoPersona" name="NUMERO_DOCUMENTO" required></div>
            <div class="field"><label>Nombre completo *</label><input name="NOMBRE_COMPLETO" required></div>
            <div class="field"><label>Correo</label><input name="CORREO" type="email"></div>
            <div class="field"><label>Teléfono</label><input name="TELEFONO"></div>
            <div class="field"><label>Comuna</label><input name="COMUNA" value="Santiago"></div>
            <div class="field"><label>Barrio</label><input name="BARRIO"></div>
            <div class="field">
              <label>Fecha de nacimiento</label>
              <input id="fechaNacimientoPersona" name="FECHA_NACIMIENTO" type="date" onchange="actualizarEdadPersona()">
            </div>
            <div class="field">
              <label>Edad actual</label>
              <input id="edadPersona" type="text" readonly placeholder="Se calcula automáticamente">
            </div>
            <div class="field"><label>Género</label><input name="GENERO"></div>
            <div class="field"><label>Nacionalidad</label><input id="nacionalidadPersona" name="NACIONALIDAD"></div>
            <div class="field"><label>Autoriza contacto</label><select name="AUTORIZA_CONTACTO"><option>No informado</option><option>Sí</option><option>No</option></select></div>
            <div class="field"><label>Participa o participó en PMJH</label><select name="PARTICIPA_PMJH"><option>No informado</option><option>Sí</option><option>No</option></select></div>
            <div class="field"><label>Escuela / línea de interés</label><select id="personaInteresEscuela" onchange="actualizarAreasPersonaInteres()"><option value="">Seleccione...</option><option>Empleo</option><option>Emprendimiento</option><option>Transversal</option></select></div>
            <div class="field"><label>Área temática de interés</label><select id="personaInteresArea" disabled><option value="">Primero seleccione una línea...</option></select></div>
            <div class="field"><label>Agregar demanda</label><button class="btn secondary" type="button" onclick="agregarInteresNuevaPersona()">Agregar interés</button></div>
            <div class="field full"><label>Intereses de capacitación declarados</label><div id="personaInteresesSeleccionados" class="notice">Sin intereses agregados. Este dato es opcional.</div></div>
            <div class="field full"><label>Observaciones</label><textarea name="OBSERVACIONES"></textarea></div>
            <div class="form-actions"><button class="btn" type="submit">Guardar persona</button></div>
          </form>
        </div>
        <div class="card panel" style="margin-bottom:18px">
          <h3>Nueva actividad</h3>
          <form id="formActividad" class="form-grid">
            <div class="field full"><label>Nombre actividad *</label><input name="NOMBRE_ACTIVIDAD" required></div>
            <div class="field"><label>Tipo *</label><select name="TIPO_ACTIVIDAD" required><option>Curso</option><option>Programa</option><option>Taller</option><option>Charla</option><option>Jornada</option></select></div>
            <div class="field"><label>Programa *</label><input name="PROGRAMA" value="Capacitación" required></div>
            <div class="field">
              <label>Escuela / línea</label>
              <select id="escuelaLineaActividad" name="ESCUELA_LINEA" onchange="actualizarAreasActividad()">
                <option value="">Seleccione una escuela o línea...</option>
                <option value="Empleo">Empleo</option>
                <option value="Emprendimiento">Emprendimiento</option>
                <option value="Transversal">Transversal</option>
              </select>
            </div>
            <div class="field">
              <label>Área temática</label>
              <select id="areaTematicaActividad" name="AREA_TEMATICA" disabled>
                <option value="">Primero seleccione una escuela o línea...</option>
              </select>
            </div>
            <div class="field"><label>Año</label><input name="ANO" type="number" value="2026"></div>
            <div class="field"><label>Sesiones</label><input name="SESIONES_TOTALES" type="number" min="1" value="1"></div>
            <div class="field"><label>Regla de resultado</label><select name="REGLA_RESULTADO"><option>Asistencia</option><option>Porcentaje</option></select></div>
            <div class="field"><label>Porcentaje de aprobación</label><input name="PORCENTAJE_APROBACION" type="number" min="0" max="100" step="0.1" placeholder="Ej.: 80"></div>
            <div class="field"><label>Requiere selección</label><select name="REQUIERE_SELECCION"><option>Sí</option><option>No</option></select></div>
            <div class="field"><label>Fecha inicio</label><input name="FECHA_INICIO" type="date"></div>
            <div class="field"><label>Fecha término</label><input name="FECHA_TERMINO" type="date"></div>
            <div class="field"><label>Modalidad</label><select name="MODALIDAD"><option>Presencial</option><option>Online</option><option>Híbrida</option></select></div>
            <div class="field"><label>Estado</label><select name="ESTADO_ACTIVIDAD"><option>Planificada</option><option>Difusión</option><option>Inscripción abierta</option><option>En ejecución</option><option>Ejecutada</option><option>Suspendida</option><option>Cerrada</option></select></div>
            <div class="field"><label>Institución asociada</label><input name="INSTITUCION_ASOCIADA"></div>
            <div class="field full"><label>Observaciones</label><textarea name="OBSERVACIONES"></textarea></div>
            <div class="form-actions"><button class="btn" type="submit">Guardar actividad</button></div>
          </form>
        </div>
        <div class="card panel">
          <h3>Nueva participación</h3>
          <form id="formParticipacion" class="form-grid">
            <div class="field"><label>Persona *</label><select id="selectPersona" name="ID_PERSONA" required></select></div>
            <div class="field"><label>Actividad *</label><select id="selectActividad" name="ID_ACTIVIDAD" required></select></div>
            <div class="field"><label>Fecha inscripción</label><input name="FECHA_INSCRIPCION" type="date"></div>
            <div class="field"><label>Cumple requisitos</label><select name="CUMPLE_REQUISITOS"><option>Pendiente</option><option>Sí</option><option>No</option><option>No informado</option></select></div>
            <div class="field"><label>Estado selección</label><select name="ESTADO_SELECCION"><option>Pendiente</option><option>Seleccionado</option><option>Lista de espera</option><option>No seleccionado</option><option>No informado</option></select></div>
            <div class="field"><label>Confirma participación</label><select name="CONFIRMA_PARTICIPACION"><option>No informado</option><option>Sí</option><option>No</option></select></div>
            <div class="field"><label>Sesiones asistidas</label><input name="SESIONES_ASISTIDAS" type="number" min="0" value="0"></div>
            <div class="field"><label>Sesiones totales</label><input name="SESIONES_TOTALES" type="number" min="1"></div>
            <div class="field full"><label>Observaciones</label><textarea name="OBSERVACIONES"></textarea></div>
            <div class="form-actions"><button class="btn" type="submit">Guardar participación</button></div>
          </form>
        </div>
      </section>
