<style>
  :root {
    --azul: #0b1f3a;
    --azul-2: #1e3a8a;
    --azul-hover: #1d4ed8;
    --celeste: #eff6ff;
    --rojo: #ef4444;
    --rojo-light: #fef2f2;
    --amarillo: #f59e0b;
    --amarillo-light: #fffbeb;
    --verde: #10b981;
    --verde-light: #ecfdf5;
    --fondo: #f8fafc;
    --texto: #0f172a;
    --gris: #64748b;
    --gris-claro: #94a3b8;
    --borde: #e2e8f0;
    --borde-subtle: #f1f5f9;
    --blanco: #ffffff;
    --sombra-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
    --sombra: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
    --sombra-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.08);
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }

  button, input, select, textarea { font: inherit; }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 260px 1fr;
  }

  /* BARRA LATERAL (SIDEBAR) */
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 24px 16px;
    color: #ffffff;
    background: linear-gradient(180deg, #0b1f3a 0%, #112d52 100%);
    box-shadow: 2px 0 12px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    z-index: 20;
  }

  .brand {
    padding: 8px 10px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 38px;
    height: 38px;
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(8px);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .brand-text small {
    display: block;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.75;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .brand-text strong {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    line-height: 1.2;
    display: block;
  }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 18px;
    overflow-y: auto;
    flex: 1;
    padding-right: 2px;
  }

  .nav-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.45);
    padding: 12px 12px 6px;
    font-weight: 700;
  }

  .menu button {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 0;
    background: transparent;
    color: rgba(255, 255, 255, 0.75);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    width: 100%;
  }

  .menu button .nav-icon {
    font-size: 16px;
    width: 20px;
    text-align: center;
    opacity: 0.85;
  }

  .menu button:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
  }

  .menu button.active {
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }

  .sidebar-footer {
    padding: 16px 12px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .badge-version {
    background: rgba(255, 255, 255, 0.15);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    color: #ffffff;
    font-weight: 600;
  }

  /* CONTENIDO PRINCIPAL */
  main {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* TOPBAR */
  .topbar {
    height: 68px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--borde);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-title-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--texto);
    margin: 0;
  }

  .top-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--gris);
    background: var(--fondo);
    border: 1px solid var(--borde);
    padding: 6px 12px;
    border-radius: 20px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: var(--verde);
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--verde-light);
  }

  /* BOTONES */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--azul-2);
    color: #ffffff;
    box-shadow: var(--sombra-sm);
  }

  .btn:hover {
    background: var(--azul-hover);
    box-shadow: var(--sombra);
  }

  .btn.secondary {
    background: var(--blanco);
    color: var(--texto);
    border-color: var(--borde);
    box-shadow: var(--sombra-sm);
  }

  .btn.secondary:hover {
    background: var(--fondo);
    border-color: var(--gris-claro);
  }

  .btn.danger {
    background: var(--rojo);
    color: white;
    box-shadow: var(--sombra-sm);
  }

  .btn.danger:hover {
    background: #dc2626;
  }

  .btn.compact {
    padding: 6px 12px;
    font-size: 12.5px;
    border-radius: var(--radius-sm);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* CONTENEDOR DE CONTENIDO */
  .content {
    padding: 32px;
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
  }

  .view { display: none; }
  .view.active {
    display: block;
    animation: fadeInView 0.2s ease-out;
  }

  @keyframes fadeInView {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 24px;
  }

  .section-head h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--texto);
  }

  .section-head p {
    margin: 0;
    font-size: 14px;
    color: var(--gris);
  }

  /* TARJETAS & PANELES */
  .card {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    box-shadow: var(--sombra-sm);
    transition: all 0.2s ease;
  }

  .panel {
    padding: 24px;
    margin-bottom: 24px;
  }

  /* KPIS DEL DASHBOARD */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi {
    padding: 20px;
    border-radius: var(--radius-lg);
    background: var(--blanco);
    border: 1px solid var(--borde);
    box-shadow: var(--sombra-sm);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .kpi:hover {
    transform: translateY(-2px);
    box-shadow: var(--sombra);
    border-color: #bfdbfe;
  }

  .kpi::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--azul-2);
  }

  .kpi:nth-child(2)::before { background: var(--verde); }
  .kpi:nth-child(3)::before { background: var(--amarillo); }
  .kpi:nth-child(4)::before { background: #8b5cf6; }
  .kpi:nth-child(5)::before { background: #0ea5e9; }
  .kpi:nth-child(6)::before { background: var(--verde); }
  .kpi:nth-child(7)::before { background: var(--azul-2); }
  .kpi:nth-child(8)::before { background: var(--amarillo); }
  .kpi:nth-child(9)::before { background: #6366f1; }
  .kpi:nth-child(10)::before { background: #14b8a6; }
  .kpi:nth-child(11)::before { background: #ec4899; }
  .kpi:nth-child(12)::before { background: #f97316; }

  .kpi span {
    color: var(--gris);
    font-size: 11.5px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .kpi strong {
    display: block;
    margin-top: 10px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--texto);
    line-height: 1.1;
  }

  /* GUIA DE KPIS */
  .kpi-guide {
    margin: 0 0 24px;
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    background: var(--blanco);
    box-shadow: var(--sombra-sm);
  }

  .kpi-guide summary {
    cursor: pointer;
    list-style: none;
    padding: 14px 18px;
    color: var(--azul-2);
    font-weight: 600;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
    outline: none;
  }

  .kpi-guide summary::-webkit-details-marker { display: none; }
  .kpi-guide summary::after { content: "+"; font-size: 20px; color: var(--azul-2); }
  .kpi-guide[open] summary { border-bottom: 1px solid var(--borde); }
  .kpi-guide[open] summary::after { content: "−"; }

  .kpi-guide-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    padding: 18px;
  }

  .kpi-guide-item strong {
    display: block;
    color: var(--texto);
    margin-bottom: 4px;
    font-size: 13px;
  }

  .kpi-guide-item p {
    margin: 0;
    color: var(--gris);
    font-size: 12.5px;
    line-height: 1.45;
  }

  .kpi-formula {
    display: block;
    margin-top: 6px;
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    background: var(--fondo);
    color: var(--texto);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    border: 1px solid var(--borde-subtle);
  }

  /* GRAFICOS */
  .charts {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .chart-card {
    padding: 22px;
    min-height: 330px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    box-shadow: var(--sombra-sm);
  }

  .chart-card.wide { grid-column: 1 / -1; }

  .chart-card h3 {
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--texto);
  }

  .chart-wrap { height: 270px; position: relative; }

  /* TABLAS & HERRAMIENTAS */
  .table-tools {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .table-tools input, .table-tools select {
    max-width: 280px;
    padding: 9px 12px;
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    background: var(--blanco);
    font-size: 13.5px;
  }

  .table-container {
    overflow: auto;
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    background: var(--blanco);
    box-shadow: var(--sombra-sm);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--blanco);
    font-size: 13.5px;
    min-width: 900px;
  }

  th {
    position: sticky;
    top: 0;
    background: #f8fafc;
    color: var(--gris);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid var(--borde);
    white-space: nowrap;
    z-index: 2;
  }

  td {
    border-bottom: 1px solid var(--borde-subtle);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--texto);
  }

  tr:hover td { background: #f8fafc; }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: none;
  }

  .badge.success { background: var(--verde-light); color: #065f46; }
  .badge.warning { background: var(--amarillo-light); color: #92400e; }
  .badge.danger { background: var(--rojo-light); color: #991b1b; }
  .badge.info { background: var(--celeste); color: var(--azul-2); }
  .badge.neutral { background: #f1f5f9; color: #475569; }

  /* FORMULARIOS */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 12.5px;
    color: var(--texto);
    font-weight: 600;
  }

  input, select, textarea {
    width: 100%;
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    padding: 10px 12px;
    background: var(--blanco);
    color: var(--texto);
    outline: none;
    font-size: 13.5px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--azul-2);
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
  }

  input[readonly] { background: #f1f5f9; color: var(--gris); cursor: not-allowed; }
  textarea { min-height: 85px; resize: vertical; }

  .notice {
    grid-column: 1 / -1;
    padding: 12px 16px;
    border-radius: var(--radius);
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    font-size: 13px;
  }

  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding-top: 10px;
  }

  /* PAGER */
  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    color: var(--gris);
    font-size: 13px;
  }

  /* GESTION PARTICIPANTES */
  /* KPIS MODULARES (REPORTES, DEMANDA, FORMULARIOS) */
  .module-kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }

  .module-kpi {
    padding: 16px 18px;
    border-radius: var(--radius-lg);
    background: var(--blanco);
    border: 1px solid var(--borde);
    box-shadow: var(--sombra-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .module-kpi:hover {
    transform: translateY(-2px);
    box-shadow: var(--sombra);
    border-color: #bfdbfe;
  }

  .module-kpi::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--azul-2);
  }

  .module-kpi.accent-blue::before { background: var(--azul-2); }
  .module-kpi.accent-emerald::before { background: var(--verde); }
  .module-kpi.accent-teal::before { background: #14b8a6; }
  .module-kpi.accent-amber::before { background: var(--amarillo); }
  .module-kpi.accent-purple::before { background: #8b5cf6; }
  .module-kpi.accent-indigo::before { background: #6366f1; }
  .module-kpi.accent-cyan::before { background: #0ea5e9; }
  .module-kpi.accent-rose::before { background: var(--rojo); }
  .module-kpi.accent-orange::before { background: #f97316; }
  .module-kpi.accent-slate::before { background: #64748b; }

  .module-kpi span {
    color: var(--gris);
    font-size: 11.5px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 6px;
  }

  .module-kpi strong {
    display: block;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--texto);
    line-height: 1.1;
  }

  /* PASOS DE IMPORTACION */
  .import-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }

  .import-step {
    padding: 16px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    box-shadow: var(--sombra-sm);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s ease;
  }

  .import-step:hover {
    border-color: #bfdbfe;
    box-shadow: var(--sombra);
    transform: translateY(-2px);
  }

  .step-badge {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--celeste);
    color: var(--azul-2);
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .import-step strong {
    display: block;
    color: var(--texto);
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .import-step p {
    margin: 0;
    color: var(--gris);
    font-size: 12px;
    line-height: 1.4;
  }

  .import-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
  }

  .mapping-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin: 16px 0;
  }

  .import-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin: 16px 0;
  }

  .import-summary .card {
    padding: 14px 16px;
    border-radius: var(--radius);
    background: var(--fondo);
    border: 1px solid var(--borde);
    box-shadow: none;
  }

  .import-summary span {
    display: block;
    color: var(--gris);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .import-summary strong {
    display: block;
    margin-top: 6px;
    font-size: 22px;
    font-weight: 800;
    color: var(--texto);
  }

  .empty-state { text-align: center; padding: 36px; color: var(--gris); }

  /* MODALES Y TOASTS */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 31, 58, 0.45);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeInModal 0.2s ease-out;
  }

  .modal-box {
    background: var(--blanco);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 550px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--borde);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--texto); }
  .modal-close { background: transparent; border: 0; font-size: 24px; cursor: pointer; color: var(--gris); }
  .modal-body { padding: 22px; }
  .modal-footer {
    padding: 16px 22px;
    border-top: 1px solid var(--borde);
    display: flex;
